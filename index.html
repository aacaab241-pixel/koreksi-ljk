<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korektor LJK Sekolah</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- CDN External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://docs.opencv.org/4.8.0/opencv.js" async onload="onOpenCvReady()"></script>
</head>
<body>

  <header class="app-header">
    <h1>Korektor LJK PWA</h1>
    <span id="cv-status" class="status-badge">Memuat OpenCV...</span>
  </header>

  <main class="container">
    
    <!-- Tab Navigation -->
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('profile')">Profil Sekolah</button>
      <button class="tab-btn" onclick="switchTab('exam')">Ujian & LJK</button>
      <button class="tab-btn" onclick="switchTab('scan')">Scan & Hasil</button>
    </nav>

    <!-- SECTION 1: Profil Sekolah -->
    <section id="tab-profile" class="tab-content active">
      <h2>Pengaturan Sekolah & Guru</h2>
      <div class="form-group">
        <label>Nama Sekolah</label>
        <input type="text" id="school-name" placeholder="misal: SMA Negeri 1 Jakarta">
      </div>
      <div class="form-group">
        <label>Nama Guru Pengampu</label>
        <input type="text" id="teacher-name" placeholder="misal: Budi Santoso, S.Pd.">
      </div>
      <div class="form-group">
        <label>Logo Sekolah</label>
        <input type="file" id="school-logo-input" accept="image/*">
        <div id="logo-preview-box">
          <img id="logo-preview" src="" alt="Preview Logo" style="display:none;">
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveProfile()">Simpan Profil</button>
    </section>

    <!-- SECTION 2: Buat Ujian & Cetak LJK -->
    <section id="tab-exam" class="tab-content">
      <h2>Pengaturan Ujian</h2>
      <div class="form-group">
        <label>Mata Pelajaran / Ujian</label>
        <input type="text" id="exam-title" placeholder="misal: Penilaian Harian IPA">
      </div>
      <div class="form-group">
        <label>Jumlah Soal</label>
        <select id="question-count">
          <option value="10">10 Soal</option>
          <option value="20" selected>20 Soal</option>
          <option value="30">30 Soal</option>
        </select>
      </div>
      <div class="form-group">
        <label>Pilihan Jawaban</label>
        <select id="option-count">
          <option value="4">A - D (4 Pilihan)</option>
          <option value="5">A - E (5 Pilihan)</option>
        </select>
      </div>

      <h3>Kunci Jawaban</h3>
      <div id="key-inputs-container" class="key-grid"></div>

      <div class="action-buttons">
        <button class="btn btn-success" onclick="generateLJKPDF()">Cetak PDF LJK</button>
        <button class="btn btn-primary" onclick="saveExamConfig()">Simpan Ujian</button>
      </div>
    </section>

    <!-- SECTION 3: Kamera & Scan -->
    <section id="tab-scan" class="tab-content">
      <h2>Kamera Scan LJK</h2>
      <div class="camera-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas-out"></canvas>
      </div>
      <button class="btn btn-danger btn-block" onclick="processScan()">Pindai / Scan Jawaban</button>

      <div id="scan-result" class="result-card" style="display:none;">
        <h3>Hasil Penilaian</h3>
        <p>Nilai: <strong id="res-score">0</strong> / 100</p>
        <p>Benar: <span id="res-correct">0</span> | Salah: <span id="res-wrong">0</span></p>
        <div class="form-group">
          <input type="text" id="student-name" placeholder="Nama Siswa">
        </div>
        <button class="btn btn-success" onclick="saveStudentResult()">Simpan Hasil Siswa</button>
      </div>

      <hr style="margin: 20px 0;">
      <h3>Rekap Nilai Class</h3>
      <button class="btn btn-secondary" onclick="exportToExcel()">Export Rekap Excel (.xlsx)</button>
      <ul id="history-list" class="history-list"></ul>
    </section>

  </main>

  <script src="js/omr-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
